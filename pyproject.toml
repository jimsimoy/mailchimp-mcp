[project]
name = "mailchimp-mcp"
version = "0.1.0"
description = "Read-only MCP server for the Mailchimp Marketing API — audiences, members, campaigns, reports, and subscribe-status change analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jan Ivan Simoy" }]
keywords = ["mailchimp", "mcp", "model-context-protocol", "marketing-api", "read-only"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Communications :: Email",
]
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
mailchimp-mcp = "mailchimp_mcp.server:main"

[project.urls]
Homepage = "https://github.com/jimsimoy/mailchimp-mcp"
Issues = "https://github.com/jimsimoy/mailchimp-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailchimp_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
